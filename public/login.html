<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM FrontyBack — Ingresar</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#141517">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <div class="login-brand">
      <div class="brand-logo">F</div>
      <span>FrontyBack</span>
    </div>
    <p class="hint">Ingresá con la cuenta de tu negocio.</p>
    <label for="slug">Usuario</label>
    <input type="text" id="slug" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p class="form-status" id="login-status"></p>
    <p style="text-align: center; margin: 18px 0 0; font-size: 13px; color: var(--text-muted);">
      ¿Todavía no tenés cuenta? <a href="/">Mirá los planes</a>
    </p>
    <button type="button" id="instalar-btn" class="btn-ghost" style="margin-top: 14px; width: 100%; font-size: 12.5px;" hidden>
      <i class="fa-solid fa-download"></i> <span id="instalar-btn-texto">Instalar la app</span>
    </button>
  </form>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('login-status');
      status.textContent = 'Ingresando...';
      status.className = 'form-status';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            slug: document.getElementById('slug').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al ingresar.');
        window.location.href = '/tablero.html';
      } catch (err) {
        status.textContent = err.message;
        status.className = 'form-status error';
      }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    // Botón "Instalar la app" bien visible, en vez de depender de que alguien encuentre la
    // opción escondida en el menú del navegador - ver public/js/tablero.js para la misma
    // lógica explicada en más detalle.
    let promptDeInstalacion = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      promptDeInstalacion = e;
      document.getElementById('instalar-btn').hidden = false;
    });
    document.getElementById('instalar-btn').addEventListener('click', async () => {
      if (!promptDeInstalacion) return;
      promptDeInstalacion.prompt();
      await promptDeInstalacion.userChoice;
      promptDeInstalacion = null;
      document.getElementById('instalar-btn').hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      document.getElementById('instalar-btn').hidden = true;
    });

    const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (esIOS && !yaInstalada) {
      document.getElementById('instalar-btn').hidden = false;
      document.getElementById('instalar-btn-texto').textContent = 'Instalar: tocá Compartir y "Agregar a inicio"';
    }
  </script>
</body>
</html>
