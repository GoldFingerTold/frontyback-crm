<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM FrontyBack — Ingresar</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#141517">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <div class="login-brand">
      <div class="brand-logo">F</div>
      <span>FrontyBack</span>
    </div>
    <p class="hint" data-i18n="login.hint">Ingresá con la cuenta de tu negocio.</p>
    <label for="slug" data-i18n="login.usuario">Usuario</label>
    <input type="text" id="slug" autocomplete="username" required>
    <label for="password" data-i18n="login.password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary" data-i18n="login.entrar">Entrar</button>
    <p class="form-status" id="login-status"></p>
    <p style="text-align: center; margin: 18px 0 0; font-size: 13px; color: var(--text-muted);">
      <span data-i18n="login.sin_cuenta">¿Todavía no tenés cuenta?</span> <a href="/" data-i18n="login.ver_planes">Mirá los planes</a>
    </p>
    <select id="login-idioma" aria-label="Idioma / Language / Idioma" style="margin-top: 14px; width: 100%; padding: 9px 12px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 9px; color: var(--text-secondary); font-size: 12.5px;">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
    </select>
    <button type="button" id="instalar-btn" class="btn-ghost" style="margin-top: 14px; width: 100%; font-size: 12.5px;" hidden>
      <i class="fa-solid fa-download"></i> <span id="instalar-btn-texto" data-i18n="login.instalar">Instalar la app</span>
    </button>
  </form>

  <script src="/js/panel-i18n.js" data-paginas="comun,login"></script>
  <script>
    document.getElementById('login-idioma').value = PanelI18n.idioma;
    document.getElementById('login-idioma').addEventListener('change', (e) => PanelI18n.cambiarIdioma(e.target.value));

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('login-status');
      status.textContent = tp('login.ingresando');
      status.className = 'form-status';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            slug: document.getElementById('slug').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.status === 401) throw new Error(tp('login.error_credenciales'));
        if (res.status === 429) throw new Error(tp('login.error_demasiados'));
        if (!res.ok) throw new Error(data.error || tp('login.error_generico'));
        window.location.href = '/tablero.html';
      } catch (err) {
        status.textContent = err.message;
        status.className = 'form-status error';
      }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    // Botón "Instalar la app" bien visible, en vez de depender de que alguien encuentre la
    // opción escondida en el menú del navegador - ver public/js/tablero.js para la misma
    // lógica explicada en más detalle.
    let promptDeInstalacion = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      promptDeInstalacion = e;
      document.getElementById('instalar-btn').hidden = false;
    });
    document.getElementById('instalar-btn').addEventListener('click', async () => {
      if (!promptDeInstalacion) return;
      promptDeInstalacion.prompt();
      await promptDeInstalacion.userChoice;
      promptDeInstalacion = null;
      document.getElementById('instalar-btn').hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      document.getElementById('instalar-btn').hidden = true;
    });

    const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (esIOS && !yaInstalada) {
      document.getElementById('instalar-btn').hidden = false;
      document.getElementById('instalar-btn-texto').textContent = tp('login.instalar_ios');
    }
  </script>
</body>
</html>
