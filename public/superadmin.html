<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrontyBack — Panel de super-admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="login-view" class="login-body">
    <form id="login-form" class="login-card">
      <div class="login-brand">
        <div class="brand-logo">F</div>
        <span>FrontyBack</span>
      </div>
      <p class="hint">Panel de super-admin.</p>
      <label for="sa-usuario">Usuario</label>
      <input type="text" id="sa-usuario" autocomplete="username" required>
      <label for="sa-password">Contraseña</label>
      <input type="password" id="sa-password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <p class="form-status" id="login-status"></p>
    </form>
  </div>

  <div id="panel-view" class="sa-shell" hidden>
    <header class="sa-header">
      <div class="brand-container" style="margin: 0; padding: 0;">
        <div class="brand-logo">F</div>
        <div class="brand-text">
          <h1>FrontyBack</h1>
          <span>Super-admin</span>
        </div>
      </div>
      <button id="sa-logout" class="btn-ghost"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salir</button>
    </header>

    <main class="sa-main">
      <section class="sa-card">
        <h2><i class="fa-solid fa-user-plus"></i> Nuevo cliente</h2>
        <form id="nuevo-cliente-form" class="sa-form">
          <div>
            <label for="nc-nombre">Nombre del negocio</label>
            <input type="text" id="nc-nombre" placeholder="Salón Jazmín" required>
          </div>
          <div>
            <label for="nc-slug">Usuario (para el login)</label>
            <input type="text" id="nc-slug" placeholder="salon-jazmin" required>
          </div>
          <div>
            <label for="nc-email">Email de contacto</label>
            <input type="email" id="nc-email" placeholder="contacto@salonjazmin.com">
          </div>
          <div>
            <label for="nc-password">Contraseña</label>
            <input type="text" id="nc-password" placeholder="mínimo 8 caracteres" required>
          </div>
          <button type="submit" class="btn btn-primary">Crear cliente</button>
        </form>
        <p class="form-status" id="nuevo-cliente-status"></p>
      </section>

      <section class="sa-card">
        <h2><i class="fa-solid fa-ticket"></i> Códigos de descuento / closers</h2>
        <form id="nuevo-codigo-form" class="sa-form">
          <div>
            <label for="co-codigo">Código</label>
            <input type="text" id="co-codigo" placeholder="JUAN10" required>
          </div>
          <div>
            <label for="co-nombre">Nombre del closer</label>
            <input type="text" id="co-nombre" required>
          </div>
          <div>
            <label for="co-contacto">Contacto</label>
            <input type="text" id="co-contacto" placeholder="email o teléfono">
          </div>
          <div>
            <label for="co-descuento">Descuento al cliente (%)</label>
            <input type="number" id="co-descuento" min="0" max="100" value="10" required>
          </div>
          <div>
            <label for="co-comision">Comisión al closer (%)</label>
            <input type="number" id="co-comision" min="0" max="100" value="10" required>
          </div>
          <button type="submit" class="btn btn-primary">Crear código</button>
        </form>
        <p class="form-status" id="nuevo-codigo-status"></p>
        <div id="codigos-lista" class="sa-tabla" style="margin-top: 18px;">
          <p class="loading">Cargando...</p>
        </div>
      </section>

      <section class="sa-card">
        <h2><i class="fa-solid fa-address-book"></i> Clientes</h2>
        <div id="clientes-lista" class="sa-tabla">
          <p class="loading">Cargando...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Editor de columnas -->
  <div id="columnas-overlay" class="overlay" hidden>
    <div class="ficha-detail">
      <button id="columnas-close" class="ficha-close"><i class="fa-solid fa-xmark"></i></button>
      <h2 id="columnas-titulo">Columnas</h2>
      <p class="ficha-contacto" style="margin-bottom: 20px;">Editá, reordená, agregá o borrá las etapas del tablero de este cliente.</p>
      <div id="columnas-lista" class="sa-columnas-lista"></div>
      <div class="sa-columna-nueva">
        <input type="text" id="columna-nueva-input" placeholder="Nombre de la columna nueva">
        <button type="button" id="columna-nueva-btn" class="btn-ghost"><i class="fa-solid fa-plus"></i></button>
      </div>
      <p class="ficha-monto-status" id="columnas-status"></p>
      <button type="button" id="columnas-guardar" class="btn btn-primary" style="margin-top: 10px;">Guardar cambios</button>
    </div>
  </div>

  <!-- Editor de WhatsApp -->
  <div id="whatsapp-overlay" class="overlay" hidden>
    <div class="ficha-detail" style="max-width: 420px;">
      <button id="whatsapp-close" class="ficha-close"><i class="fa-solid fa-xmark"></i></button>
      <h2>Conectar WhatsApp</h2>
      <p class="ficha-contacto" style="margin-bottom: 20px;" id="whatsapp-cliente-nombre"></p>
      <div class="ficha-mover">
        <label for="whatsapp-input">Phone Number ID (de Meta)</label>
        <input type="text" id="whatsapp-input" placeholder="Ej: 1366767613181502" style="width: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 10px 12px; color: var(--text-primary); font-family: inherit; font-size: 13px;">
      </div>
      <p class="ficha-monto-status" id="whatsapp-status"></p>
      <button type="button" id="whatsapp-guardar" class="btn btn-primary">Guardar</button>
    </div>
  </div>

  <script src="/js/superadmin.js"></script>
</body>
</html>
