<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar turno — FrontyBack</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .rv-shell { min-height: 100vh; background: linear-gradient(to bottom, var(--bg-main), #0e0f10); }
  .rv-header { display: flex; align-items: center; justify-content: center; padding: 24px 32px; }
  .rv-brand { display: flex; align-items: center; gap: 10px; }
  .rv-brand span { font-family: 'Clash Display', sans-serif; font-weight: 600; font-size: 15px; color: var(--text-muted); }

  .rv-card { max-width: 480px; margin: 10px auto 40px; padding: 0 24px; }
  .rv-card-inner {
    background: rgba(28,29,31,0.8); border: 1px solid var(--border-subtle); border-radius: 16px;
    padding: 32px;
  }
  .rv-negocio { text-align: center; margin-bottom: 26px; }
  .rv-negocio h1 { font-family: 'Clash Display', sans-serif; font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .rv-negocio p { color: var(--text-muted); font-size: 13px; margin: 0; }

  .rv-paso-titulo { font-size: 13px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }

  .rv-servicio-btn, .rv-dia-btn {
    display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-subtle); border-radius: 10px; padding: 13px 16px;
    color: var(--text-primary); font-family: inherit; font-size: 14px; cursor: pointer; margin-bottom: 8px;
  }
  .rv-servicio-btn:hover, .rv-dia-btn:hover { border-color: var(--accent-gold); }
  .rv-servicio-btn .dur, .rv-dia-btn .cant { color: var(--text-muted); font-size: 12px; float: right; }

  .rv-horarios { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .rv-horario-btn {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: 9px 4px; color: var(--text-primary); font-family: inherit; font-size: 13px; cursor: pointer;
    flex: 1 1 70px; text-align: center;
  }
  .rv-horario-btn:hover, .rv-horario-btn.elegido { border-color: var(--accent-gold); color: var(--accent-gold); }

  .rv-volver { background: none; border: none; color: var(--text-muted); font-size: 12.5px; cursor: pointer; padding: 0; margin-bottom: 14px; }
  .rv-resumen { background: rgba(212,175,55,0.07); border: 1px solid rgba(212,175,55,0.2); border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 18px; }

  .rv-form label { display: block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin: 0 0 6px; }
  .rv-form input { width: 100%; padding: 11px 13px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 9px; font-size: 0.9rem; font-family: inherit; color: var(--text-primary); outline: none; margin-bottom: 14px; }
  .rv-form input:focus { border-color: rgba(212,175,55,0.4); }

  #rv-btn-confirmar { width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer; background: var(--accent-gold); color: #141517; font-weight: 700; font-size: 14.5px; font-family: inherit; }
  #rv-btn-confirmar:disabled { opacity: 0.6; cursor: default; }

  .rv-estado { margin-top: 16px; font-size: 13.5px; text-align: center; }
  .rv-estado.error { color: var(--danger); }
  .rv-ok i { font-size: 38px; color: #2bb673; margin-bottom: 12px; }
  .rv-ok { text-align: center; }
  .rv-ok h2 { font-family: 'Clash Display', sans-serif; font-size: 19px; margin: 0 0 8px; }
  .rv-ok p { color: var(--text-secondary); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div class="rv-shell">
  <header class="rv-header">
    <div class="rv-brand">
      <div class="brand-logo" style="width: 26px; height: 26px; font-size: 13px;">F</div>
      <span>Reservas FrontyBack</span>
    </div>
  </header>

  <div class="rv-card">
    <div class="rv-card-inner" id="rv-contenido">
      <p class="loading">Cargando...</p>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const slug = (params.get('slug') || '').trim();
  const cont = document.getElementById('rv-contenido');

  function esc(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const ESTADO = { servicio: null, profesional: null, dia: null, horario: null, negocio: null, servicios: [], profesionales: [], sena: null };

  async function init() {
    if (!slug) {
      cont.innerHTML = '<h1>Falta un dato</h1><p>Este link no es válido.</p>';
      return;
    }
    try {
      const data = await fetch(`/api/public/turnos/${encodeURIComponent(slug)}/config`).then((r) => {
        if (!r.ok) throw new Error('No encontramos este negocio.');
        return r.json();
      });
      ESTADO.negocio = data.nombre_negocio;
      ESTADO.servicios = data.servicios;
      ESTADO.profesionales = data.profesionales || [];
      ESTADO.sena = data.sena || { activa: false, monto: 0 };
      if (!ESTADO.servicios.length) {
        cont.innerHTML = `<div class="rv-negocio"><h1>${esc(ESTADO.negocio)}</h1></div><p class="loading">Todavía no hay servicios para reservar. Volvé a intentarlo más tarde.</p>`;
        return;
      }
      mostrarPasoServicio();
    } catch (err) {
      cont.innerHTML = `<p class="loading">${esc(err.message)}</p>`;
    }
  }

  function encabezado() {
    return `<div class="rv-negocio"><h1>${esc(ESTADO.negocio)}</h1><p>Reservá tu turno</p></div>`;
  }

  function mostrarPasoServicio() {
    ESTADO.profesional = null;
    cont.innerHTML = encabezado() + `
      <p class="rv-paso-titulo">¿Qué necesitás?</p>
      ${ESTADO.servicios.map((s) => `
        <button type="button" class="rv-servicio-btn" data-servicio="${s.id}">
          ${esc(s.nombre)} <span class="dur">${s.duracion_min} min</span>
        </button>
      `).join('')}
    `;
    cont.querySelectorAll('[data-servicio]').forEach((btn) => {
      btn.addEventListener('click', () => {
        ESTADO.servicio = ESTADO.servicios.find((s) => s.id === btn.dataset.servicio);
        if (ESTADO.profesionales.length) mostrarPasoProfesional();
        else cargarHorarios();
      });
    });
  }

  function mostrarPasoProfesional() {
    cont.innerHTML = encabezado() + `
      <button type="button" class="rv-volver" id="rv-volver-servicio-prof"><i class="fa-solid fa-arrow-left"></i> Elegir otro servicio</button>
      <p class="rv-paso-titulo">¿Con quién preferís?</p>
      ${ESTADO.profesionales.map((p) => `<button type="button" class="rv-servicio-btn" data-profesional="${p.id}">${esc(p.nombre)}</button>`).join('')}
    `;
    document.getElementById('rv-volver-servicio-prof').addEventListener('click', mostrarPasoServicio);
    cont.querySelectorAll('[data-profesional]').forEach((btn) => {
      btn.addEventListener('click', () => {
        ESTADO.profesional = ESTADO.profesionales.find((p) => p.id === btn.dataset.profesional);
        cargarHorarios();
      });
    });
  }

  async function cargarHorarios() {
    cont.innerHTML = encabezado() + '<p class="loading">Buscando horarios libres...</p>';
    try {
      const profesionalQuery = ESTADO.profesional ? `&profesional_id=${encodeURIComponent(ESTADO.profesional.id)}` : '';
      const data = await fetch(`/api/public/turnos/${encodeURIComponent(slug)}/horarios?servicio_id=${encodeURIComponent(ESTADO.servicio.id)}${profesionalQuery}`).then((r) => {
        if (!r.ok) throw new Error('No se pudieron cargar los horarios.');
        return r.json();
      });
      ESTADO.dias = data.dias;
      mostrarPasoDia();
    } catch (err) {
      cont.innerHTML = encabezado() + `<p class="rv-estado error">${esc(err.message)}</p>`;
    }
  }

  function mostrarPasoDia() {
    if (!ESTADO.dias.length) {
      cont.innerHTML = encabezado() + '<p class="loading">No hay horarios libres en los próximos días. Probá de nuevo más tarde.</p>';
      return;
    }
    const tituloConProfesional = ESTADO.profesional ? `${esc(ESTADO.servicio.nombre)} con ${esc(ESTADO.profesional.nombre)}` : esc(ESTADO.servicio.nombre);
    cont.innerHTML = encabezado() + `
      <button type="button" class="rv-volver" id="rv-volver-servicio"><i class="fa-solid fa-arrow-left"></i> ${ESTADO.profesional ? 'Elegir otro profesional' : 'Elegir otro servicio'}</button>
      <p class="rv-paso-titulo">${tituloConProfesional} — elegí un día</p>
      ${ESTADO.dias.map((d) => `
        <button type="button" class="rv-dia-btn" data-fecha="${d.fecha}">
          ${esc(d.dia_nombre)} ${d.fecha.split('-').reverse().slice(0, 2).join('/')} <span class="cant">${d.horarios.length} horarios</span>
        </button>
      `).join('')}
    `;
    document.getElementById('rv-volver-servicio').addEventListener('click', ESTADO.profesional ? mostrarPasoProfesional : mostrarPasoServicio);
    cont.querySelectorAll('[data-fecha]').forEach((btn) => {
      btn.addEventListener('click', () => {
        ESTADO.dia = ESTADO.dias.find((d) => d.fecha === btn.dataset.fecha);
        mostrarPasoHorario();
      });
    });
  }

  function mostrarPasoHorario() {
    cont.innerHTML = encabezado() + `
      <button type="button" class="rv-volver" id="rv-volver-dia"><i class="fa-solid fa-arrow-left"></i> Elegir otro día</button>
      <p class="rv-paso-titulo">${esc(ESTADO.dia.dia_nombre)} ${ESTADO.dia.fecha.split('-').reverse().slice(0, 2).join('/')} — elegí un horario</p>
      <div class="rv-horarios">
        ${ESTADO.dia.horarios.map((h) => `<button type="button" class="rv-horario-btn" data-hora="${h.hora_inicio}">${h.hora_inicio}</button>`).join('')}
      </div>
    `;
    document.getElementById('rv-volver-dia').addEventListener('click', mostrarPasoDia);
    cont.querySelectorAll('[data-hora]').forEach((btn) => {
      btn.addEventListener('click', () => {
        ESTADO.horario = btn.dataset.hora;
        mostrarPasoDatos();
      });
    });
  }

  function mostrarPasoDatos() {
    cont.innerHTML = encabezado() + `
      <button type="button" class="rv-volver" id="rv-volver-horario"><i class="fa-solid fa-arrow-left"></i> Elegir otro horario</button>
      <div class="rv-resumen">
        <strong>${esc(ESTADO.servicio.nombre)}</strong>${ESTADO.profesional ? ` con ${esc(ESTADO.profesional.nombre)}` : ''}<br>
        ${esc(ESTADO.dia.dia_nombre)} ${ESTADO.dia.fecha.split('-').reverse().slice(0, 2).join('/')} a las ${esc(ESTADO.horario)}hs
        ${ESTADO.sena?.activa ? `<br><span style="color: var(--accent-gold);">Seña para confirmar: $${ESTADO.sena.monto.toLocaleString('es-AR')} ARS (vía Mercado Pago, en el siguiente paso)</span>` : ''}
      </div>
      <form class="rv-form" id="rv-form">
        <input type="text" id="rv-hp" style="position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
        <label for="rv-nombre">Tu nombre</label>
        <input type="text" id="rv-nombre" required maxlength="120">
        <label for="rv-telefono">Tu WhatsApp</label>
        <input type="text" id="rv-telefono" required placeholder="+54 9 11 ...">
        <label for="rv-email">Tu email <span style="text-transform: none; font-weight: 400; color: var(--text-muted);">(opcional)</span></label>
        <input type="email" id="rv-email" placeholder="para mandarte el recordatorio">
        <button type="submit" id="rv-btn-confirmar">${ESTADO.sena?.activa ? 'Ir a pagar la seña' : 'Confirmar turno'}</button>
      </form>
      <p class="rv-estado" id="rv-estado"></p>
    `;
    document.getElementById('rv-volver-horario').addEventListener('click', mostrarPasoHorario);
    document.getElementById('rv-form').addEventListener('submit', confirmar);
  }

  async function confirmar(e) {
    e.preventDefault();
    const btn = document.getElementById('rv-btn-confirmar');
    const estadoEl = document.getElementById('rv-estado');
    btn.disabled = true;
    estadoEl.className = 'rv-estado';
    estadoEl.textContent = 'Reservando...';
    try {
      const res = await fetch(`/api/public/turnos/${encodeURIComponent(slug)}/reservar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          servicio_id: ESTADO.servicio.id,
          profesional_id: ESTADO.profesional ? ESTADO.profesional.id : '',
          fecha: ESTADO.dia.fecha,
          hora_inicio: ESTADO.horario,
          nombre: document.getElementById('rv-nombre').value.trim(),
          telefono: document.getElementById('rv-telefono').value.trim(),
          email: document.getElementById('rv-email').value.trim(),
          _hp: document.getElementById('rv-hp').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se pudo reservar.');
      if (data.pago_requerido) {
        estadoEl.textContent = 'Te llevamos a Mercado Pago para pagar la seña...';
        window.location.href = data.init_point;
        return;
      }
      mostrarExito(data.turno.token_gestion);
    } catch (err) {
      estadoEl.className = 'rv-estado error';
      estadoEl.textContent = err.message;
      btn.disabled = false;
    }
  }

  function mostrarExito(tokenGestion) {
    const linkGestion = tokenGestion ? `${window.location.origin}/mi-turno.html?token=${tokenGestion}` : null;
    cont.innerHTML = `
      <div class="rv-ok">
        <i class="fa-solid fa-circle-check"></i>
        <h2>¡Turno confirmado!</h2>
        <p>${esc(ESTADO.servicio.nombre)}${ESTADO.profesional ? ` con ${esc(ESTADO.profesional.nombre)}` : ''} el ${esc(ESTADO.dia.dia_nombre)} ${ESTADO.dia.fecha.split('-').reverse().slice(0, 2).join('/')} a las ${esc(ESTADO.horario)}hs.<br>Te vamos a escribir por WhatsApp para confirmarlo.</p>
        ${linkGestion ? `<p style="margin-top: 16px; font-size: 12.5px;">¿Necesitás cancelar o cambiar el horario después?<br><a href="${esc(linkGestion)}" style="color: var(--accent-gold);">Guardá este link</a> (también te lo mandamos por email si lo cargaste).</p>` : ''}
      </div>
    `;
  }

  init();
</script>
</body>
</html>
