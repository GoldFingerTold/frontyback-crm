<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM FrontyBack — Tablero</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#141517">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside>
      <div>
        <div class="brand-container">
          <div class="brand-logo">F</div>
          <div class="brand-text">
            <h1>FrontyBack</h1>
            <span>CRM Hub</span>
          </div>
        </div>
        <nav class="nav-menu">
          <a href="/tablero.html" class="nav-item active"><i class="fa-solid fa-diagram-project"></i> Embudo de Ventas</a>
          <a href="/estadisticas.html" class="nav-item" id="nav-estadisticas" hidden><i class="fa-solid fa-chart-column"></i> Estadísticas</a>
          <button type="button" id="nav-empleados" class="nav-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-family: inherit;" hidden>
            <i class="fa-solid fa-users"></i> Empleados
          </button>
        </nav>
      </div>

      <div class="user-section">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">•</div>
          <div class="user-details">
            <h4 id="user-nombre">—</h4>
            <span id="user-slug"></span>
            <span id="user-rol" style="display: block; font-size: 11px; color: var(--text-muted);"></span>
          </div>
        </div>
        <button id="logout-btn" class="btn-ghost" title="Salir"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>

      <label id="aviso-lead-label" style="display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--text-muted); cursor: pointer;" hidden>
        <input type="checkbox" id="aviso-lead-checkbox" style="margin: 0;">
        Avisarme por email de leads nuevos
      </label>
      <button type="button" id="push-btn" class="btn-ghost" style="margin-top: 10px; width: 100%; font-size: 11.5px; padding: 8px;">
        <i class="fa-regular fa-bell"></i> <span id="push-btn-texto">Activar notificaciones</span>
      </button>
      <button type="button" id="instalar-btn" class="btn btn-primary" style="margin-top: 10px; width: 100%; font-size: 11.5px; padding: 8px;" hidden>
        <i class="fa-solid fa-download"></i> Instalar la app
      </button>
    </aside>

    <div class="main-content">
      <header>
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Buscar por nombre o contacto">
        </div>
        <div class="header-actions">
          <div class="metrics-badge">
            <i class="fa-solid fa-bolt"></i>
            <span id="metrics-nuevas-hoy">0 nuevas hoy</span>
          </div>
          <button class="notif-btn" id="notif-btn" title="Notificaciones">
            <i class="fa-regular fa-bell"></i>
            <span class="notif-badge" id="notif-badge" hidden></span>
          </button>
          <button class="notif-btn mobile-only" id="logout-btn-mobile" title="Salir">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <div id="estado-banner" class="estado-banner" hidden></div>

      <div id="stage-tabs" class="stage-tabs"></div>

      <main id="board" class="board">
        <p class="loading">Cargando...</p>
      </main>
    </div>
  </div>

  <div id="ficha-overlay" class="overlay" hidden>
    <div class="ficha-detail">
      <button id="ficha-close" class="ficha-close"><i class="fa-solid fa-xmark"></i></button>
      <div id="ficha-body"></div>
    </div>
  </div>

  <div id="empleados-overlay" class="overlay" hidden>
    <div class="ficha-detail" style="max-width: 480px;">
      <button id="empleados-close" class="ficha-close"><i class="fa-solid fa-xmark"></i></button>
      <h2>Empleados</h2>
      <p class="ficha-contacto" style="margin-bottom: 18px;">Cada empleado ve solo las fichas del departamento que le asignes. Vos (Gerencia) seguís viendo todo.</p>
      <div id="empleados-lista" class="sa-columnas-lista"></div>
      <form id="empleado-nuevo-form" class="sa-form" style="max-width: none; margin-top: 16px;">
        <div>
          <label for="emp-nombre">Nombre</label>
          <input type="text" id="emp-nombre" required>
        </div>
        <div>
          <label for="emp-usuario">Usuario (para el login)</label>
          <input type="text" id="emp-usuario" required>
        </div>
        <div>
          <label for="emp-password">Contraseña</label>
          <input type="text" id="emp-password" placeholder="mínimo 8 caracteres" required>
        </div>
        <div>
          <label for="emp-departamento">Departamento</label>
          <select id="emp-departamento" required></select>
        </div>
        <button type="submit" class="btn btn-primary">Agregar empleado</button>
      </form>
      <p class="form-status" id="empleado-status"></p>
    </div>
  </div>

  <script src="/js/tablero.js"></script>
</body>
</html>
