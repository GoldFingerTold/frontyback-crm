<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM FrontyBack — Ingresar</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <h1>CRM FrontyBack</h1>
    <p class="hint">Ingresá con la cuenta de tu negocio.</p>
    <label for="slug">Usuario</label>
    <input type="text" id="slug" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p class="form-status" id="login-status"></p>
  </form>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('login-status');
      status.textContent = 'Ingresando...';
      status.className = 'form-status';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            slug: document.getElementById('slug').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al ingresar.');
        window.location.href = '/tablero.html';
      } catch (err) {
        status.textContent = err.message;
        status.className = 'form-status error';
      }
    });
  </script>
</body>
</html>
